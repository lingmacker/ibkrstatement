<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="IBKR Analytics Studio is a local-first Interactive Brokers Activity Statement parser for NAV, positions, trades, P/L, fees, interest, and portfolio exposure."
    />
    <meta name="robots" content="noindex,nofollow" />
    <title>IBKR Analytics Studio</title>
    <link rel="icon" type="image/svg+xml" href="./assets/icon.svg" />
    <script type="module">
      const ASSET_VERSION = "2.1.10";
      const stylesheet = document.createElement("link");
      stylesheet.rel = "stylesheet";
      stylesheet.href = `./assets/styles.css?v=${ASSET_VERSION}`;
      document.head.append(stylesheet);
      await new Promise((resolve) => {
        stylesheet.addEventListener("load", resolve, { once: true });
        stylesheet.addEventListener("error", resolve, { once: true });
      });
      await import(`./src/app.js?v=${ASSET_VERSION}`);
    </script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
